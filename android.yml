name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de npm
        run: npm install

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar entorno nativo Android desde cero
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "La carpeta android/ ya existe, se omite 'cap add android'."
          fi

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Inyectar permisos de GPS e Internet en el manifiesto
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "--- Manifiesto antes de inyectar permisos ---"
          cat "$MANIFEST"

          for PERM in "android.permission.INTERNET" "android.permission.ACCESS_FINE_LOCATION" "android.permission.ACCESS_COARSE_LOCATION"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s#<application#<uses-permission android:name=\"$PERM\" />\n    <application#" "$MANIFEST"
            else
              echo "El permiso $PERM ya existe, se omite."
            fi
          done

          echo "--- Manifiesto después de inyectar permisos ---"
          cat "$MANIFEST"

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Enrutador-HMO-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
